<form [formGroup]="form()" class="flex flex-col gap-4 py-4">
  @if (form().get('id')?.value) {
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-gray-600">ID</label>
      <input
        type="text"
        formControlName="id"
        readonly
        class="px-3 py-2 rounded-md border border-gray-200 bg-gray-100 text-gray-500 cursor-not-allowed focus:outline-none"
      />
    </div>
  }

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium text-gray-700">Nome completo</label>
    <input
      type="text"
      formControlName="fullName"
      placeholder="Nome completo"
      class="px-3 py-2 rounded-md border border-gray-300 bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium text-gray-700">Email</label>
    <input
      type="email"
      formControlName="email"
      placeholder="nome@exemplo.com"
      class="px-3 py-2 rounded-md border border-gray-300 bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium text-gray-700">
      Senha
      @if (form().get('id')?.value) {
        <span class="text-xs text-gray-500">(deixe em branco para manter)</span>
      }
    </label>
    <input
      type="password"
      formControlName="password"
      placeholder="••••••••"
      class="px-3 py-2 rounded-md border border-gray-300 bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium text-gray-700">Nível de acesso</label>
    <select
      formControlName="accessLevel"
      class="px-3 py-2 rounded-md border border-gray-300 bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
    >
      <option value="MANAGER">Gerente</option>
      <option value="OPERATOR">Operador</option>
    </select>
  </div>
</form>

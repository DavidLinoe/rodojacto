<component-totalizer
  [count]="(devicesFacade.count$ | async) ?? 0"
  [title]="'Dispositivos'"
  [actions]="[
    {
      label: 'Criar',
      icon: '+',
      callback: (item) => openCreateDevice(),
    },
  ]"
></component-totalizer>

<component-table
  [items]="devicesFacade.devices$ | async"
  [columns]="columns"
  [actions]="[
    {
      label: 'Editar',
      icon: 'edit',
      callback: (item) => openEditDevice(item),
    },
    {
      label: 'Excluir',
      icon: 'delete',
      callback: (item) => deleteDevice(item),
    },
  ]"
></component-table>

<component-modal
  [open]="open"
  [buttons]="[
    {
      label: deviceFormGroup.get('id')?.value ? 'Atualizar' : 'Criar',
      disabled: false,
      callback: (item) => submitDevice(),
    },
  ]"
  (close)="open = false"
  [title]="deviceFormGroup.get('id')?.value ? 'Editar Dispositivo' : 'Criar Dispositivo'"
>
  <feature-devices-component-device-modal
    [form]="deviceFormGroup"
  ></feature-devices-component-device-modal>
</component-modal>

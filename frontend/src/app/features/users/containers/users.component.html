<component-totalizer
  [count]="(usersFacade.count$ | async) ?? 0"
  [title]="'Collaborators'"
  [actions]="[
    {
      label: 'Create',
      icon: '+',
      callback: (item) => openCreateCollaborator(),
    },
  ]"
></component-totalizer>

<component-table
  [items]="usersFacade.users$ | async"
  [columns]="columns"
  [actions]="[
    {
      label: 'Edit',
      icon: 'edit',
      callback: (item) => openEditCollaborator(item),
    },
    {
      label: 'Delete',
      icon: 'delete',
      callback: (item) => deleteCollaborator(item),
    },
  ]"
></component-table>

<component-modal
  [open]="open"
  [buttons]="[
    {
      label: userFormGroup.get('id')?.value ? 'Update' : 'Create',
      disabled: false,
      callback: (item) => submitCollaborator(),
    },
  ]"
  (close)="open = false"
  [title]="userFormGroup.get('id')?.value ? 'Edit Collaborator' : 'Create Collaborator'"
>
  <feature-users-component-user-modal [form]="userFormGroup"></feature-users-component-user-modal>
</component-modal>

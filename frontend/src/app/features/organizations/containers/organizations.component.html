<component-totalizer
  [count]="(organizationsFacade.count$ | async) ?? 0"
  [title]="'Organizações'"
  [actions]="[
    {
      label: 'Criar',
      icon: '+',
      callback: (item) => openCreateOrganization(),
    },
  ]"
></component-totalizer>

<component-table
  [items]="organizationsFacade.organizations$ | async"
  [columns]="columns"
  [actions]="[
    {
      label: 'Editar',
      icon: 'edit',
      callback: (item) => openEditOrganization(item),
    },
    {
      label: 'Excluir',
      icon: 'delete',
      callback: (item) => deleteOrganization(item),
    },
  ]"
></component-table>

<component-modal
  [open]="open"
  [buttons]="[
    {
      label: organizationFormGroup.get('id')?.value ? 'Atualizar' : 'Criar',
      disabled: false,
      callback: (item) => submitOrganization(),
    },
  ]"
  (close)="open = false"
  [title]="organizationFormGroup.get('id')?.value ? 'Editar Organização' : 'Criar Organização'"
>
  <feature-organizations-component-organization-modal
    [form]="organizationFormGroup"
  ></feature-organizations-component-organization-modal>
</component-modal>
